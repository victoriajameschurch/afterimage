<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AFTERIMAGE — Archive</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <a href="index.html" class="logo">
            AFTERIMAGE
        </a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="archive.html">ARCHIVE</a>
            <a href="science.html">SCIENCE</a>
        </nav>

    </header>


    <main class="archive">


        <section class="archive-intro">

            <p class="eyebrow">
                THE ARCHIVE
            </p>

            <h1>
                Things that<br>
                stayed.
            </h1>

            <p class="archive-description">
                Anonymous fragments of memory,
                thought, and existence.
            </p>

            <p id="archive-count"
               class="section-label"
               style="margin-top: 35px;">
                LOADING MEMORIES...
            </p>

        </section>


        <section
            class="memory-grid"
            id="memory-grid">

            <p id="loading">
                Loading the archive...
            </p>

        </section>


        <section class="archive-footer">

            <p>
                Have something worth leaving behind?
            </p>

            <a href="index.html#submit">
                LEAVE A MEMORY →
            </a>

        </section>


    </main>


    <script>

        const scriptURL =
            "https://script.google.com/macros/s/AKfycbwmIdLX70Mb1JCvqwobJS_AErbhvEqbUak6owPqHPvu_CwPnsdFDXyutujTb--d8XM/exec";


        const grid =
            document.getElementById("memory-grid");

        const countElement =
            document.getElementById("archive-count");


        fetch(scriptURL)

            .then(response => response.json())

            .then(memories => {

                grid.innerHTML = "";


                countElement.textContent =
                    memories.length +
                    (
                        memories.length === 1
                            ? " MEMORY PRESERVED"
                            : " MEMORIES PRESERVED"
                    );


                if (memories.length === 0) {

                    grid.innerHTML = `
                        <p>
                            The archive is still empty.
                        </p>
                    `;

                    return;
                }


                memories.reverse().forEach(memory => {

                    const card =
                        document.createElement("article");

                    card.className =
                        "memory-card";


                    const question =
                        document.createElement("p");

                    question.className =
                        "memory-question";

                    question.textContent =
                        memory.question;


                    const text =
                        document.createElement("p");

                    text.className =
                        "memory-text";

                    text.textContent =
                        memory.memory;


                    const anonymous =
                        document.createElement("span");

                    anonymous.className =
                        "anonymous";

                    anonymous.textContent =
                        "— anonymous";


                    card.appendChild(question);

                    card.appendChild(text);

                    card.appendChild(anonymous);

                    grid.appendChild(card);

                });

            })


            .catch(error => {

                console.error(error);

                countElement.textContent =
                    "ARCHIVE UNAVAILABLE";

                grid.innerHTML = `
                    <p>
                        The archive couldn't be loaded.
                        Please try again later.
                    </p>
                `;

            });

    </script>


</body>

</html>
